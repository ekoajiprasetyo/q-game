server {
    server_name game.q-link.my.id;

    root /var/www/q-game/public;
    index index.php index.html;

    access_log /var/log/nginx/q-game.access.log;
    error_log /var/log/nginx/q-game.error.log;

    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Dedicated pool: Q-Game cannot consume workers used by the other apps.
        fastcgi_pass unix:/run/php/php8.3-q-game.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
