; Dedicated and deliberately bounded PHP-FPM pool for Q-Game.
; This protects the shared www pool used by Q-Link, Q-Exam, and Q-Space.
[q_game]
user = www-data
group = www-data

listen = /run/php/php8.3-q-game.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 2
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

clear_env = no

; Keep the server-side limit aligned with the admin question-image form.
php_admin_value[upload_max_filesize] = 5M
php_admin_value[post_max_size] = 6M
